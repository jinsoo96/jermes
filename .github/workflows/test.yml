# 밀 때마다 도는 검사. **발행은 안 한다** - 그건 release.yml 이 태그일 때만 한다.
#
# 이 파일은 공개 레포에도 그대로 간다. 공개본에는 PyPI 토큰이 없고 있을 이유도
# 없으므로, 거기서는 이것만 돌면 된다.
name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 런타임 의존성이 0 인지
        run: |
          python -m pip install --upgrade pip build pytest
          python - <<'PY'
          import tomllib, sys
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"].get("dependencies") or []
          if deps:
              sys.exit(f"런타임 의존성이 생겼습니다: {deps}")
          print("런타임 의존성 0 확인")
          PY

      - name: 테스트
        run: python -m pytest -q

      - name: 빌드하고, 깨끗한 곳에 깔아서 실제로 도는지
        run: |
          python -m build
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          JERMES_HOME=/tmp/jermes-home /tmp/probe/bin/jermes demo | tail -3
